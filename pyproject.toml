[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-system-data-scanner"
version = "0.1.0"
description = "Read-only scanner for macOS System Data hotspots."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "yongzheng9405" }
]

[project.scripts]
macos-system-data-scanner = "macos_system_data_scanner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
